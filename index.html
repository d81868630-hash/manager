<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>대리콜 매니저</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <div class="eyebrow">FAST V2</div>
        <h1>🚗 대리콜 매니저</h1>
        <p>스크린샷 → iPhone OCR → 즉시 콜 분석</p>
      </div>
    </header>

    <section class="hero">
      <div class="hero-title">초고속 분석</div>
      <div class="hero-sub">카카오/T맵 화면을 캡처한 뒤 iPhone 단축어에서 <b>대리콜 분석</b>을 실행하세요.</div>
      <button id="demoBtn" class="primary">샘플 콜로 테스트</button>
    </section>

    <section class="card">
      <label for="textInput">OCR 텍스트</label>
      <textarea id="textInput" placeholder="단축어가 전달한 텍스트가 여기에 들어옵니다. 직접 붙여넣어도 됩니다."></textarea>
      <div class="actions">
        <button id="analyzeBtn" class="primary">⚡ 즉시 분석</button>
        <button id="clearBtn" class="secondary">지우기</button>
      </div>
    </section>

    <section id="result" class="card result hidden"></section>

    <section class="card">
      <h2>사용 순서</h2>
      <ol>
        <li>카카오/T맵에서 콜 화면을 캡처</li>
        <li>사진 공유 → <b>대리콜 분석</b> 단축어 실행</li>
        <li>iPhone이 이미지에서 글자를 추출</li>
        <li>이 페이지가 자동으로 열리며 즉시 점수 계산</li>
      </ol>
      <p class="note">웹에서 별도 AI OCR을 기다리지 않고, iPhone 단축어의 이미지 텍스트 인식을 먼저 사용하도록 설계했습니다.</p>
    </section>
  </main>
<script src="app.js"></script>
</body>
</html>
