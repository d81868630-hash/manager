<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="대리콜 매니저">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>대리콜 매니저</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">DAERI CALL MANAGER</div>
        <h1>대리콜 매니저</h1>
        <p>카카오 · T맵 콜을 캡처해서 바로 비교하세요.</p>
      </div>
      <div class="pill">iPhone PWA</div>
    </header>

    <section class="hero">
      <div class="hero-score"><span id="heroScore">--</span><small>점</small></div>
      <div>
        <strong id="heroGrade">콜 분석 대기</strong>
        <p id="heroSub">스크린샷을 선택하면 금액·시간·거리·예상 시급을 계산합니다.</p>
      </div>
    </section>

    <section class="actions">
      <label class="primary-btn">
        <input id="imageInput" type="file" accept="image/*">
        <span>📸 콜 화면 캡처 분석</span>
      </label>
      <button id="demoBtn" class="secondary-btn">샘플 콜 불러오기</button>
    </section>

    <section id="previewCard" class="card hidden">
      <img id="preview" alt="선택한 콜 화면">
      <div class="progress-wrap hidden" id="progressWrap">
        <div class="progress"><i id="progressBar"></i></div>
        <span id="progressText">OCR 준비 중…</span>
      </div>
    </section>

    <section id="resultCard" class="card hidden">
      <div class="section-title"><span>분석 결과</span><span id="sourceBadge" class="badge">-</span></div>
      <div class="money" id="amount">-</div>
      <div class="route">
        <div><span>출발</span><strong id="pickup">-</strong></div>
        <div class="arrow">↓</div>
        <div><span>도착</span><strong id="destination">-</strong></div>
      </div>
      <div class="metrics">
        <div><span>운행시간</span><strong id="duration">-</strong></div>
        <div><span>출발 이동</span><strong id="pickupKm">-</strong></div>
        <div><span>운행거리</span><strong id="tripKm">-</strong></div>
        <div><span>예상 시급</span><strong id="hourly">-</strong></div>
      </div>
      <div class="score-line">
        <div><span id="grade" class="grade">-</span><small id="scoreReason">-</small></div>
        <div class="big-score" id="score">-</div>
      </div>
      <div id="reasons" class="reasons"></div>
      <button id="saveBtn" class="primary-btn full">💾 운행기록에 저장</button>
    </section>

    <section class="card">
      <div class="section-title"><span>오늘 기록</span><button id="clearBtn" class="text-btn">전체삭제</button></div>
      <div id="history" class="history empty">아직 저장된 콜이 없습니다.</div>
    </section>

    <section class="card help">
      <strong>아이폰에서 앱처럼 사용하기</strong>
      <p>Safari에서 이 페이지를 연 뒤 <b>공유 → 홈 화면에 추가 → 웹 앱으로 열기</b>를 선택하세요. 홈 화면에서 독립된 앱처럼 실행됩니다.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
